services:

  # Plus requis pour le RAG schéma sémantique (Redis désormais, cf. commentaire du service
  # `backend` plus bas) — conservé pour l'architecture prévue (auth/multi-tenant, cf.
  # CLAUDE.md), pas utilisé par le code applicatif aujourd'hui.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brouxai-postgres
    environment:
      POSTGRES_USER: narr8
      POSTGRES_PASSWORD: narr8dev
      POSTGRES_DB: narr8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narr8 -d narr8"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brouxai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: brouxai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: brouxai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/narr8-dev &&
        mc anonymous set download local/narr8-dev &&
        echo 'Bucket narr8-dev créé.'
      "
    restart: "no"

  # Optionnel — profil conteneurisé du backend (déploiement/tests proches de la prod).
  # N'est plus requis pour le RAG schéma sémantique : les embeddings sont stockés dans
  # Redis (app/services/schema_rag.py), pas Postgres, précisément parce qu'un backend natif
  # Windows (requis pour le serveur MCP Power BI, lui-même incompatible avec ce conteneur
  # Linux — voir README.md, section RAG schéma sémantique) ne pouvait pas joindre le
  # Postgres dockerisé de façon fiable. `environment:` surcharge les URLs localhost de
  # backend/.env avec les noms de service Docker (redis/minio).
  backend:
    build: ./backend
    container_name: brouxai-backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
