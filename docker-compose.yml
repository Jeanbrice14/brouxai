services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brouxai-postgres
    environment:
      POSTGRES_USER: narr8
      POSTGRES_PASSWORD: narr8dev
      POSTGRES_DB: narr8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narr8 -d narr8"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brouxai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: brouxai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: brouxai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/narr8-dev &&
        mc anonymous set download local/narr8-dev &&
        echo 'Bucket narr8-dev créé.'
      "
    restart: "no"

  # Optionnel — recommandé sur Windows si le backend natif (uvicorn lancé directement sur
  # l'hôte) échoue à se connecter à Postgres (voir README.md, section RAG schéma sémantique,
  # "Blocage réseau Windows → Postgres" pour le diagnostic complet). `environment:` surcharge
  # les URLs localhost de backend/.env avec les noms de service Docker (postgres/redis/minio).
  backend:
    build: ./backend
    container_name: brouxai-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://narr8:narr8dev@postgres:5432/narr8
      DATABASE_URL_SYNC: postgresql://narr8:narr8dev@postgres:5432/narr8
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
